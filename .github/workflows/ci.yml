name: 'CI'

on:
  push:
    branches:
    - main
    - features/**
    - cursor/**
  pull_request:

env:
  DOTNET_NOLOGO: true

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        runs-on: [macOS-latest, ubuntu-latest, windows-latest]
    name: ${{ matrix.runs-on }}
    runs-on: ${{ matrix.runs-on }}
    steps:
    - uses: actions/checkout@v4
      with:
        fetch-depth: 0

    - uses: actions/setup-dotnet@v4
      with:
        dotnet-version: |
          8.0.x
          10.0.x

    - run: dotnet --info

    - name: Upgrade script tests
      if: runner.os != 'Windows'
      working-directory: scripts/upgrade-namespaces
      run: python3 test_rewrite.py

    - name: Build and test
      if: runner.os != 'Windows'
      run: ./build.sh

    - name: Build and test
      if: runner.os == 'Windows'
      run: ./build.ps1

    - name: Build quickstart samples
      shell: bash
      run: |
        set -euo pipefail
        for sln in samples/Quickstarts/*/Quickstart.sln; do
          echo "Building $sln"
          dotnet build "$sln" --nologo -v q
        done
